# Unified plant-health catalog for the website model.
#
# Every source class maps to a canonical label  "Crop | part | Condition"  with a kind:
#   disease | pest | nutrient | abiotic | healthy | nonplant
# Class value forms:
#   "Condition"                      -> default part of the dataset; kind = healthy if Condition == Healthy else disease
#   [Condition, part]                -> explicit part
#   [Condition, part, kind]          -> explicit part and kind
#   part "plant"                     -> photos of any/several parts (web-scraped classes)
#   null                             -> class skipped (generic "diseased"/"dry", unknown meaning, augmented artefacts)
#
# source: hf:<repo>[@folder]  |  hf-conv:<repo>  |  fo:<repo>  |  git:plantvillage  |  tgz:imagenette
#         local:<dir>  -> images already on disk under $PLANT_LOCAL_DATA (default ../kaggle_data). Used for
#                         Kaggle datasets: download them yourself from the `url` given (Kaggle account needed);
#                         the project never contacts Kaggle and holds no credentials.
# budget_mb: max parquet MB downloaded for this dataset (shards taken in random order).
# Licences are listed so the website can show attribution; *-nc datasets are non-commercial only.

defaults:
  cap_per_class: 800
  budget_mb: 2500

datasets:
  # ------------------------------------------------------------------ multi-crop
  - name: plantvillage
    source: git:plantvillage
    license: CC0 (Hughes & Salathé 2015)
    cap_per_class: 1500
    part: leaf
    classes:
      Apple___Apple_scab: [Apple, Apple scab]
      Apple___Black_rot: [Apple, Frogeye leaf spot]   # leaf photos: same fungus as black rot; on leaves it is frogeye leaf spot
      Apple___Cedar_apple_rust: [Apple, Cedar apple rust]
      Apple___healthy: [Apple, Healthy]
      Blueberry___healthy: [Blueberry, Healthy]
      Cherry_(including_sour)___Powdery_mildew: [Cherry, Powdery mildew]
      Cherry_(including_sour)___healthy: [Cherry, Healthy]
      Corn_(maize)___Cercospora_leaf_spot Gray_leaf_spot: [Maize, Gray leaf spot]
      Corn_(maize)___Common_rust_: [Maize, Common rust]
      Corn_(maize)___Northern_Leaf_Blight: [Maize, Northern leaf blight]
      Corn_(maize)___healthy: [Maize, Healthy]
      Grape___Black_rot: [Grape, Black rot]
      Grape___Esca_(Black_Measles): [Grape, Esca (black measles)]
      Grape___Leaf_blight_(Isariopsis_Leaf_Spot): [Grape, Isariopsis leaf spot]
      Grape___healthy: [Grape, Healthy]
      Orange___Haunglongbing_(Citrus_greening): [Orange, Huanglongbing (citrus greening)]
      Peach___Bacterial_spot: [Peach, Bacterial spot]
      Peach___healthy: [Peach, Healthy]
      Pepper,_bell___Bacterial_spot: [Bell pepper, Bacterial spot]
      Pepper,_bell___healthy: [Bell pepper, Healthy]
      Potato___Early_blight: [Potato, Early blight]
      Potato___Late_blight: [Potato, Late blight]
      Potato___healthy: [Potato, Healthy]
      Raspberry___healthy: [Raspberry, Healthy]
      Soybean___healthy: [Soybean, Healthy]
      Squash___Powdery_mildew: [Squash, Powdery mildew]
      Strawberry___Leaf_scorch: [Strawberry, Leaf scorch]
      Strawberry___healthy: [Strawberry, Healthy]
      Tomato___Bacterial_spot: [Tomato, Bacterial spot]
      Tomato___Early_blight: [Tomato, Early blight]
      Tomato___Late_blight: [Tomato, Late blight]
      Tomato___Leaf_Mold: [Tomato, Leaf mold]
      Tomato___Septoria_leaf_spot: [Tomato, Septoria leaf spot]
      Tomato___Spider_mites Two-spotted_spider_mite: [Tomato, Two-spotted spider mite, leaf, pest]
      Tomato___Target_Spot: [Tomato, Target spot]
      Tomato___Tomato_Yellow_Leaf_Curl_Virus: [Tomato, Yellow leaf curl virus]

segmentation:
  method: none
  output: black
  crop_pad: 0.05
  morphology: true
  kernel_frac: 0.02
  fill_holes: true
  min_component_frac: 0.02
  lesion_protect: true
  grabcut: false
  grabcut_iters: 3
  threshold_sample: 2000
  hist_sigma: 3.0
  hist_min_prominence: 0.05
model:
  img_size: 224
  pretrained: true
  drop_rate: 0.3
  backbone: efficientnet_b0
backbones:
- efficientnet_b0
seeds:
- 0
train:
  batch_size: 48
  eval_batch_size: 128
  epochs: 18
  freeze_epochs: 1
  lr_head: 0.002
  lr: 0.0004
  weight_decay: 0.05
  warmup_epochs: 1
  min_lr_ratio: 0.01
  label_smoothing: 0.1
  early_stopping_patience: 5
  grad_clip: 1.0
  amp: auto
  balanced_sampling: false
  weighted_loss: false
  deterministic: true
augment:
  enabled: true
  paper_geometric: true
  random_resized_crop: true
  rrc_scale:
  - 0.5
  - 1.0
  color_jitter: 0.25
  mixup:
    enabled: false
    mixup_alpha: 0.2
    cutmix_alpha: 0.2
    prob: 0.3
hpo:
  enabled: false
  n_trials: 6
  epochs: 6
  seed: 0
  trial_seed: 0
  space:
    train.lr:
      type: loguniform
      low: 3.0e-05
      high: 0.0005
    train.lr_head:
      type: loguniform
      low: 0.0003
      high: 0.003
    train.weight_decay:
      type: loguniform
      low: 0.001
      high: 0.1
eval:
  tta: true
  gradcam_n: 12
summary:
  pairs:
  - exp_a: exp1_borb

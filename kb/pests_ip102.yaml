  prevention:
  - Clean planting material and timely sowing.
  spread: Adults walk or fly in from field margins; larvae develop in soil or inside plant tissue.
  symptoms: Notches or holes chewed in leaves, buds or roots; larvae feed inside roots, stems, seeds or fruit.
  type: Insect pest (weevil)
Slug caterpillars:
  chemical:
  - Registered insecticides (e.g. emamectin benzoate, chlorantraniliprole, indoxacarb) when larvae pass the local
    threshold; rotate modes of action.
  cultural:
  - Hand-pick caterpillars and egg masses in small plots; remove weeds that host them.
  - Plough or flood after harvest to kill pupae in the soil.
  organic:
  - Bacillus thuringiensis, spinosad or neem on young larvae; nuclear polyhedrosis virus (NPV) where available.
  - Encourage birds and parasitic wasps.
  pathogen: Limacodidae
  prevention:
  - Scout weekly; pheromone or light traps for early warning.
  spread: Moths or butterflies lay eggs on leaves; several generations per season; outbreaks after warm, wet spells.
  symptoms: Leaves chewed from the edges or skeletonised, sometimes rolled or webbed; green or brown caterpillars
    and droppings on the plant.
  type: Insect pest (leaf-eating caterpillar)
Small brown planthopper:
  chemical:
  - Registered systemic insecticides (e.g. pymetrozine, dinotefuran) only above the local threshold; avoid pyrethroids
    that cause resurgence.
  cultural:
  - Avoid excess nitrogen and very dense planting; drain rice fields periodically.
  - Remove weeds and volunteer plants that host hoppers.
  organic:
  - Conserve spiders, mirid predators and parasitoids; light traps; neem.
  pathogen: Laodelphax striatellus
  prevention:
  - Resistant varieties; synchronised planting; regular scouting at the plant base.
  spread: Adults fly or are carried by wind between fields; populations explode with dense crops and excess nitrogen.
  symptoms: Leaves yellow or mottled from sap feeding; honeydew and sooty mould; heavy attacks cause "hopper burn"
    (patches of dried plants). Some species transmit viruses.
  type: Insect pest (planthopper / leafhopper)
Spherical mealybug:
  chemical:
  - Registered systemic insecticides (e.g. spirotetramat, buprofezin) at crawler emergence.
  cultural:
  - Prune and destroy heavily infested twigs; control ants that protect scales.
  organic:
  - Horticultural oil sprays at crawler stage; conserve ladybird beetles and parasitoid wasps (e.g. Rodolia for
    cottony cushion scale).
  pathogen: Nipaecoccus viridis (vastator)
  prevention:
  - Inspect new plants; keep trees vigorous and dust-free.
  spread: Crawlers move to new growth and are carried by wind, ants, birds and nursery stock.
  symptoms: Small shell-like, waxy or cottony insects fixed on leaves, twigs and fruit; yellowing, honeydew and
    sooty mould; twig die-back.
  type: Insect pest (scale insect / mealybug)
Spotted alfalfa aphid:
  chemical:
  - Registered selective aphicides (e.g. flonicamid, pirimicarb) when colonies pass the threshold.
  cultural:
  - Remove heavily infested shoots; avoid excess nitrogen; control weeds.
  - Strong water sprays on small plants.
  organic:
  - Insecticidal soap, neem or mineral oil; conserve ladybirds, lacewings and parasitic wasps.
  pathogen: Therioaphis maculata
  prevention:
  - Monitor with yellow sticky traps; protect natural enemies by avoiding broad-spectrum sprays.
  spread: Winged forms fly between plants; populations grow very fast in mild, dry weather.
  symptoms: Clusters of small soft insects on young leaves, shoots or ears; leaves curl and yellow; sticky honeydew
    and black sooty mould. Many aphids spread viruses.
  type: Insect pest (aphid)
Spotted lanternfly:
  chemical:
  - Registered systemic insecticides (e.g. pymetrozine, dinotefuran) only above the local threshold; avoid pyrethroids
    that cause resurgence.
  cultural:
  - Avoid excess nitrogen and very dense planting; drain rice fields periodically.
  - Remove weeds and volunteer plants that host hoppers.
  organic:
  - Conserve spiders, mirid predators and parasitoids; light traps; neem.
  pathogen: Lycorma delicatula
  prevention:
  - Resistant varieties; synchronised planting; regular scouting at the plant base.
  spread: Adults fly or are carried by wind between fields; populations explode with dense crops and excess nitrogen.
  symptoms: Leaves yellow or mottled from sap feeding; honeydew and sooty mould; heavy attacks cause "hopper burn"
    (patches of dried plants). Some species transmit viruses.
  type: Insect pest (planthopper / leafhopper)
Tarnished plant bug:
  chemical:
  - Registered insecticides at bud stage when counts exceed the threshold.
  cultural:
  - Control weeds in and around the field; avoid planting next to alfalfa when it is cut.
  organic:
  - Neem; conserve predators; trap crops.
  pathogen: Lygus lineolaris
  prevention:
  - Scout buds and shoot tips with a beat tray or sweep net.
  spread: Adults fly in from weeds and neighbouring crops; several generations per season.
  symptoms: Small brown or black spots and holes on young leaves that tear as they expand; buds and young fruit
    deformed or dropped.
  type: Insect pest (plant bug / mirid)
Tobacco cutworm:
  chemical:
  - Registered insecticides (e.g. emamectin benzoate, chlorantraniliprole, indoxacarb) when larvae pass the local
    threshold; rotate modes of action.
  cultural:
  - Hand-pick caterpillars and egg masses in small plots; remove weeds that host them.
  - Plough or flood after harvest to kill pupae in the soil.
  organic:
  - Bacillus thuringiensis, spinosad or neem on young larvae; nuclear polyhedrosis virus (NPV) where available.
  - Encourage birds and parasitic wasps.
  pathogen: Spodoptera litura
  prevention:
  - Scout weekly; pheromone or light traps for early warning.
  spread: Moths or butterflies lay eggs on leaves; several generations per season; outbreaks after warm, wet spells.
  symptoms: Leaves chewed from the edges or skeletonised, sometimes rolled or webbed; green or brown caterpillars
    and droppings on the plant.
  type: Insect pest (leaf-eating caterpillar)
Wheat blossom midge:
  chemical:
  - Registered insecticides timed to adult flights at the susceptible stage.
  cultural:
  - Adjust sowing date so the susceptible stage avoids adult flights; plough residue; rotate crops.
  organic:
  - Conserve parasitoid wasps; remove and destroy galled shoots.
  pathogen: Sitodiplosis mosellana
  prevention:
  - Resistant varieties and monitoring traps.
  spread: Small adult flies lay eggs at a susceptible crop stage; larvae overwinter in soil or residue.
  symptoms: Galls or swellings on leaves, shoots or florets; maggots feed inside stems, leaves or developing grain,
    causing shrivelled grain or dead shoots.
  type: Insect pest (gall midge / fly larvae)
Wheat leaf miner:
  chemical:
  - Registered translaminar insecticides (e.g. abamectin, cyromazine) at early mining.
  cultural:
  - Pick and destroy mined leaves early; remove weeds and residue.
  organic:
  - Yellow sticky traps; neem; conserve parasitic wasps.
  pathogen: Cerodonta denticornis
  prevention:
  - Monitor young leaves; avoid broad-spectrum sprays that kill parasitoids.
  spread: Small flies or moths lay eggs in leaves; many short generations.
  symptoms: Winding white or silvery tunnels (mines) or blotches inside leaves; heavily mined leaves dry up.
  type: Insect pest (leaf miner)
Wheat sawfly:
  chemical:
  - Registered insecticides on young larvae when damage exceeds thresholds.
  cultural:
  - Plough stubble; rotate crops; hand-pick larvae in small plots.
  organic:
  - Conserve parasitoids; neem on young larvae.
  pathogen: Dolerus / Cephus spp.
  prevention:
  - Resistant (solid-stem) varieties where available.
  spread: Adults emerge from soil or stubble in spring.
  symptoms: Caterpillar-like larvae eat leaves from the edges, or larvae inside stems cause lodging.
  type: Insect pest (sawfly)
Wheat thrips:
  chemical:
  - Registered insecticides (e.g. spinetoram, fipronil where allowed) when damage starts; rotate modes of action.
  cultural:
  - Overhead irrigation or mulch to reduce populations; remove weeds.
  organic:
  - Blue sticky traps; spinosad, neem or predatory mites (Amblyseius).
  pathogen: Haplothrips tritici
  prevention:
  - Scout flowers and young leaves; clean transplants.
  spread: Tiny insects carried by wind; pupate in soil; worse in hot, dry weather.
  symptoms: Silvery or bronze streaks and tiny black dots on leaves; young leaves curl upward; flowers and fruit
    scarred.
  type: Insect pest (thrips)
White grubs:
  chemical:
  - Registered seed treatments or soil-applied insecticides where damage history justifies it.
  cultural:
  - Deep ploughing to expose larvae to birds; avoid planting right after grassland; good drainage.
  organic:
  - Entomopathogenic nematodes or Metarhizium; light traps for adults.
  pathogen: Holotrichia spp. and other chafer larvae
  prevention:
  - Monitor with bait traps before planting; rotate crops.
  spread: Live in soil for months or years, especially after grass or pasture; adults fly at night.
  symptoms: Seedlings wilt, are cut or pulled down; roots, tubers or seeds chewed or tunnelled; patchy stand.
  type: Insect pest (soil-dwelling)
White-backed planthopper:
  chemical:
  - Registered systemic insecticides (e.g. pymetrozine, dinotefuran) only above the local threshold; avoid pyrethroids
    that cause resurgence.
  cultural:
  - Avoid excess nitrogen and very dense planting; drain rice fields periodically.
  - Remove weeds and volunteer plants that host hoppers.
  organic:
  - Conserve spiders, mirid predators and parasitoids; light traps; neem.
  pathogen: Sogatella furcifera
  prevention:
  - Resistant varieties; synchronised planting; regular scouting at the plant base.
  spread: Adults fly or are carried by wind between fields; populations explode with dense crops and excess nitrogen.
  symptoms: Leaves yellow or mottled from sap feeding; honeydew and sooty mould; heavy attacks cause "hopper burn"
    (patches of dried plants). Some species transmit viruses.
  type: Insect pest (planthopper / leafhopper)
White-margined moth:
  chemical:
  - Registered insecticides (e.g. emamectin benzoate, chlorantraniliprole, indoxacarb) when larvae pass the local
    threshold; rotate modes of action.
  cultural:
  - Hand-pick caterpillars and egg masses in small plots; remove weeds that host them.
  - Plough or flood after harvest to kill pupae in the soil.
  organic:
  - Bacillus thuringiensis, spinosad or neem on young larvae; nuclear polyhedrosis virus (NPV) where available.
  - Encourage birds and parasitic wasps.
  pathogen: Noctuid moth larvae
  prevention:
  - Scout weekly; pheromone or light traps for early warning.
  spread: Moths or butterflies lay eggs on leaves; several generations per season; outbreaks after warm, wet spells.
  symptoms: Leaves chewed from the edges or skeletonised, sometimes rolled or webbed; green or brown caterpillars
    and droppings on the plant.
  type: Insect pest (leaf-eating caterpillar)
White-spotted flower chafer:
  chemical:
  - Registered contact insecticides on adults when numbers are high; soil application for grubs where justified.
  cultural:
  - Hand-collect adults in the morning; plough to expose grubs; use well-rotted manure only.
  organic:
  - Light traps for adults; neem; Metarhizium or Beauveria for soil grubs.
  pathogen: Protaetia brevitarsis
  prevention:
  - Monitor at flowering; avoid planting next to heavily infested fields.
  spread: Adults fly in from field edges; grubs live in soil rich in manure or organic matter.
  symptoms: Holes or shot-holes in leaves, flowers or fruit; adults feed in groups; white C-shaped grubs of chafers
    damage roots.
  type: Insect pest (leaf beetle / chafer)
Winter grain mite:
  chemical:
  - Registered acaricides (e.g. abamectin, spiromesifen, hexythiazox) at early infestation; rotate.
  cultural:
  - Keep plants well watered; reduce dust; remove badly infested leaves.
  organic:
  - Wettable sulphur (check crop safety), neem or horticultural oil; release predatory mites.
  pathogen: Penthaleus major
  prevention:
  - Avoid unnecessary broad-spectrum insecticides; check leaf undersides weekly in dry weather.
  spread: Mites drift on wind and on tools or clothing; explode in hot, dry, dusty weather and after insecticides
    kill their predators.
  symptoms: Fine yellow or bronze speckling on leaves, sometimes fine webbing underneath; leaves dry and drop. Some
    mites cause galls, felt patches or rusty fruit.
  type: Mite pest
Wireworms:
  chemical:
  - Registered seed treatments or soil-applied insecticides where damage history justifies it.
  cultural:
  - Deep ploughing to expose larvae to birds; avoid planting right after grassland; good drainage.
  organic:
  - Entomopathogenic nematodes or Metarhizium; light traps for adults.
  pathogen: Click-beetle larvae (Elateridae)
  prevention:
  - Monitor with bait traps before planting; rotate crops.
  spread: Live in soil for months or years, especially after grass or pasture; adults fly at night.
  symptoms: Seedlings wilt, are cut or pulled down; roots, tubers or seeds chewed or tunnelled; patchy stand.
  type: Insect pest (soil-dwelling)
Yellow cutworm:
  chemical:
  - Poison baits or soil-directed sprays of registered insecticides in the evening.
  cultural:
  - Clean weeds 2 weeks before planting; dig around cut plants at dawn and destroy larvae.
  - Collar transplants with paper or plastic rings.
  organic:
  - Baits of bran with Bacillus thuringiensis; entomopathogenic nematodes.
  pathogen: Agrotis segetum
  prevention:
  - Deep ploughing, weed-free seedbeds, and pheromone traps for moth flights.
  spread: Moths lay eggs on weeds and crop residue before planting; larvae hide in soil by day.
  symptoms: Seedlings cut off at soil level overnight; grey-brown caterpillars curl into a C-shape in the soil nearby.
  type: Insect pest (cutworm)
Yellow peach moth:
  chemical:
  - Registered systemic insecticides (e.g. chlorantraniliprole, flubendiamide) at egg hatch when traps or dead hearts
    pass the local threshold.
  cultural:
  - Remove and destroy egg masses and dead hearts; cut stubble close to the ground after harvest.
  - Avoid excess nitrogen; synchronise planting with neighbours.
  organic:
  - Release Trichogramma egg parasitoids; pheromone traps for monitoring and mass trapping.
  - Bacillus thuringiensis or neem when larvae hatch.
  pathogen: Conogethes punctiferalis
  prevention:
  - Tolerant varieties, field sanitation, light or pheromone traps for early warning.
  spread: Moths lay egg masses on leaves; larvae bore in within days. Stubble and volunteer plants carry the next
    generation.
  symptoms: Caterpillars tunnel inside stems; the central shoot dries ("dead heart") in young plants, and heads
    or panicles turn white and empty later; small holes and frass on stems.
  type: Insect pest (stem borer)
Yellow stem borer:
  chemical:

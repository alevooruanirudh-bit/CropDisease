Greenhouse whitefly:
  chemical:
  - Registered insecticides (e.g. pyriproxyfen, spirotetramat) when numbers pass the threshold; rotate.
  cultural:
  - Remove weeds and old crop; use insect netting in nurseries.
  organic:
  - Yellow sticky traps; insecticidal soap, neem; Encarsia formosa parasitoids in greenhouses.
  pathogen: Trialeurodes vaporariorum
  prevention:
  - Clean transplants; crop-free periods to break the cycle.
  spread: Adults fly between plants; very fast build-up in warm, sheltered conditions and greenhouses.
  symptoms: Tiny white flying insects under leaves that rise when disturbed; yellowing, honeydew and sooty mould;
    some spread viruses.
  type: Insect pest (whitefly)
Japanese orange fly:
  chemical:
  - Registered bait sprays applied to foliage spots, not whole trees.
  cultural:
  - Collect and destroy fallen and infested fruit daily (bury deep or seal in bags).
  - Harvest promptly; plough under trees to expose pupae.
  organic:
  - Protein bait sprays with spinosad; male-annihilation traps (methyl eugenol or cue-lure); fruit bagging.
  pathogen: Bactrocera tsuneonis
  prevention:
  - Area-wide trapping with neighbours; orchard sanitation every season.
  spread: Adult flies lay eggs under the skin of ripening fruit; larvae pupate in the soil below the tree.
  symptoms: Small puncture marks on fruit skin; fruit rot and drop early; maggots inside the flesh.
  type: Insect pest (fruit fly)
Large cutworm:
  chemical:
  - Poison baits or soil-directed sprays of registered insecticides in the evening.
  cultural:
  - Clean weeds 2 weeks before planting; dig around cut plants at dawn and destroy larvae.
  - Collar transplants with paper or plastic rings.
  organic:
  - Baits of bran with Bacillus thuringiensis; entomopathogenic nematodes.
  pathogen: Agrotis tokionis
  prevention:
  - Deep ploughing, weed-free seedbeds, and pheromone traps for moth flights.
  spread: Moths lay eggs on weeds and crop residue before planting; larvae hide in soil by day.
  symptoms: Seedlings cut off at soil level overnight; grey-brown caterpillars curl into a C-shape in the soil nearby.
  type: Insect pest (cutworm)
Leafhoppers:
  chemical:

Blister beetles:
  chemical:
  - Registered contact insecticides when swarms damage flowers; never feed infested hay to livestock (toxic).
  cultural:
  - Shake beetles into a bucket of soapy water using gloves; mow field borders.
  organic:
  - Neem or kaolin clay sprays; control grasshopper populations.
  pathogen: Meloidae
  prevention:
  - Cut forage before flowering in risk areas; scout field edges.
  spread: Adults fly in swarms; larvae feed on grasshopper eggs in the soil.
  symptoms: Groups of long, soft-bodied beetles eating flowers and leaves; sudden defoliation in patches. The beetles
    release a blistering chemical — do not handle them with bare hands.
  type: Insect pest (blister beetle)
Broad mite:
  chemical:
  - Registered acaricides (e.g. abamectin, spiromesifen, hexythiazox) at early infestation; rotate.
  cultural:
  - Keep plants well watered; reduce dust; remove badly infested leaves.
  organic:
  - Wettable sulphur (check crop safety), neem or horticultural oil; release predatory mites.
  pathogen: Polyphagotarsonemus latus
  prevention:
  - Avoid unnecessary broad-spectrum insecticides; check leaf undersides weekly in dry weather.
  spread: Mites drift on wind and on tools or clothing; explode in hot, dry, dusty weather and after insecticides
    kill their predators.
  symptoms: Fine yellow or bronze speckling on leaves, sometimes fine webbing underneath; leaves dry and drop. Some
    mites cause galls, felt patches or rusty fruit.
  type: Mite pest

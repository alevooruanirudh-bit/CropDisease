Chinese citrus fly:
  chemical:
  - Registered bait sprays applied to foliage spots, not whole trees.
  cultural:
  - Collect and destroy fallen and infested fruit daily (bury deep or seal in bags).
  - Harvest promptly; plough under trees to expose pupae.
  organic:
  - Protein bait sprays with spinosad; male-annihilation traps (methyl eugenol or cue-lure); fruit bagging.
  pathogen: Bactrocera minax
  prevention:
  - Area-wide trapping with neighbours; orchard sanitation every season.
  spread: Adult flies lay eggs under the skin of ripening fruit; larvae pupate in the soil below the tree.
  symptoms: Small puncture marks on fruit skin; fruit rot and drop early; maggots inside the flesh.
  type: Insect pest (fruit fly)

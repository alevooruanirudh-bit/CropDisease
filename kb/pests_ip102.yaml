  - Kill larvae in tunnels with a wire probe.
  organic:
  - Plug cleaned holes with cotton soaked in neem oil; entomopathogenic nematodes into tunnels.
  pathogen: Xylotrechus pyrrhoderus
  prevention:
  - Avoid bark wounds, remove dead wood, and inspect trunks regularly.
  spread: Adults lay eggs in bark cracks or wounds; larvae feed inside the wood for months.
  symptoms: Holes in trunks, canes or branches with sawdust-like frass or sap; shoots or whole branches wilt and
    die back.
  type: Insect pest (wood-boring beetle or moth)
Grasshoppers and locusts:
  chemical:
  - Baits or sprays when nymphs are young; locust swarms are handled by national plant-protection services.
  cultural:
  - Till egg-laying sites; mow field margins.
  organic:
  - Metarhizium acridum biopesticide; poultry in small plots.
  pathogen: Acridoidea (Locustoidea)
  prevention:
  - Monitor field edges early in the season; report swarms.
  spread: Hatch from eggs in uncultivated soil; adults fly between fields; locust swarms travel long distances.
  symptoms: Large irregular bites from leaf edges, sometimes complete defoliation in swarms.
  type: Insect pest (grasshopper / locust)
Green blister beetle:
  chemical:
  - Registered contact insecticides when swarms damage flowers; never feed infested hay to livestock (toxic).
  cultural:
  - Shake beetles into a bucket of soapy water using gloves; mow field borders.
  organic:
  - Neem or kaolin clay sprays; control grasshopper populations.
  pathogen: Lytta polita
  prevention:
  - Cut forage before flowering in risk areas; scout field edges.
  spread: Adults fly in swarms; larvae feed on grasshopper eggs in the soil.
  symptoms: Groups of long, soft-bodied beetles eating flowers and leaves; sudden defoliation in patches. The beetles
    release a blistering chemical — do not handle them with bare hands.
  type: Insect pest (blister beetle)
Green broad-winged planthopper:
  chemical:
  - Registered systemic insecticides (e.g. pymetrozine, dinotefuran) only above the local threshold; avoid pyrethroids
    that cause resurgence.
  cultural:
  - Avoid excess nitrogen and very dense planting; drain rice fields periodically.
  - Remove weeds and volunteer plants that host hoppers.
  organic:
  - Conserve spiders, mirid predators and parasitoids; light traps; neem.
  pathogen: Salurnis marginella
  prevention:
  - Resistant varieties; synchronised planting; regular scouting at the plant base.
  spread: Adults fly or are carried by wind between fields; populations explode with dense crops and excess nitrogen.
  symptoms: Leaves yellow or mottled from sap feeding; honeydew and sooty mould; heavy attacks cause "hopper burn"
    (patches of dried plants). Some species transmit viruses.
  type: Insect pest (planthopper / leafhopper)
Green citrus aphid:
  chemical:
  - Registered selective aphicides (e.g. flonicamid, pirimicarb) when colonies pass the threshold.
  cultural:
  - Remove heavily infested shoots; avoid excess nitrogen; control weeds.
  - Strong water sprays on small plants.
  organic:
  - Insecticidal soap, neem or mineral oil; conserve ladybirds, lacewings and parasitic wasps.
  pathogen: Aphis spiraecola (citricola)
  prevention:
  - Monitor with yellow sticky traps; protect natural enemies by avoiding broad-spectrum sprays.
  spread: Winged forms fly between plants; populations grow very fast in mild, dry weather.
  symptoms: Clusters of small soft insects on young leaves, shoots or ears; leaves curl and yellow; sticky honeydew
    and black sooty mould. Many aphids spread viruses.
  type: Insect pest (aphid)
Green leafhopper:
  chemical:
  - Registered systemic insecticides (e.g. pymetrozine, dinotefuran) only above the local threshold; avoid pyrethroids
    that cause resurgence.
  cultural:

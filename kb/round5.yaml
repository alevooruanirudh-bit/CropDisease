  Cercospora leaf spot: {Coffee: Cercospora coffeicola (brown eye spot)}
  Phoma leaf spot: {Coffee: Phoma tarda / P. costarricensis}
  Bacterial leaf spot: {Lettuce: Xanthomonas hortorum pv. vitians}
  Septoria leaf spot: {Lettuce: Septoria lactucae}
  Bacterial blight: {Soybean: Pseudomonas savastanoi pv. glycinea}
  Leaf blight: {Apricot: Leaf-blighting fungi (e.g. Alternaria / Monilinia spp.)}
